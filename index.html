<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TkFoodLab V22.2 (Complete Fixed)</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { touch-action: manipulation; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #role-select { display: flex; flex-direction: column; gap: 20px; margin-top: 100px; width: 100%; max-width: 300px; }
        .role-btn { padding: 30px; font-size: 1.5em; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: bold; }
        
        #pos-view { display: none; width: 100%; max-width: 420px; flex-direction: column; align-items: center; padding-bottom: 50px; }
        .pos-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .settings-btn { background: #7f8c8d; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 0.9em; cursor: pointer; }

        .display { background: #2c3e50; color: #fff; width: 100%; padding: 20px; text-align: right; font-size: 2.5em; font-weight: bold; border-radius: 15px; margin-bottom: 10px; }
        .order-id-display { font-size: 0.4em; color: #ecf0f1; display: block; margin-bottom: 5px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .item-btn { padding: 10px 5px; font-size: 1.1em; border: none; border-radius: 10px; color: white; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 85px; box-shadow: 0 3px 0 rgba(0,0,0,0.1); position: relative; }
        .item-btn:active { transform: translateY(2px); box-shadow: none; }
        .item-price { font-size: 0.8em; opacity: 0.9; margin-top: 4px; }
        .stock-tag { font-size: 0.7em; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
        
        .btn-food { background: #f39c12; } 
        .btn-drink { background: #3498db; } 
        .btn-combo { background: #27ae60; } 
        .btn-undo { background: #f1c40f; color: #333; grid-column: span 2; margin-top: 5px; }

        .history-box { width: 100%; margin: 10px 0; background: #fff; border: 2px solid #3498db; padding: 10px; border-radius: 12px; min-height: 60px; }
        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
        .btn-sumup { background: #0053a0; grid-column: span 2; padding: 18px; font-size: 1.3em; color:white; border:none; border-radius:10px; font-weight:bold; } 
        .btn-cash { background: #27ae60; padding: 15px; font-size: 1.1em; color:white; border:none; border-radius:10px; font-weight:bold;} 
        .btn-clear { background: #e74c3c; padding: 15px; font-size: 1.1em; color:white; border:none; border-radius:10px; font-weight:bold;}

        .admin-section { width: 100%; border-top: 2px dashed #bdc3c7; margin-top: 20px; padding-top: 15px; }
        .stat-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; font-size: 1.1em; }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 95%; max-width: 480px; height: 85%; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; }
        .modal-body { flex: 1; overflow-y: auto; }
        .edit-card { border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; }
        .save-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; font-size: 1.1em; }
        .void-btn { background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>📝 產品清單管理</h3></div>
            <div class="modal-body" id="productList"></div>
            <button onclick="addNewProductRow()" style="padding:12px; background:#3498db; color:white; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">➕ 新增產品項目</button>
            <button class="save-btn" onclick="saveProductConfig()">💾 儲存並更新 POS 選單</button>
            <button onclick="closeModal('productModal')" style="margin-top:10px; padding:8px; border:none; background:none; color:#7f8c8d;">取消離開</button>
        </div>
    </div>

    <div id="inventoryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>📦 庫存設定</h3></div>
            <div class="modal-body" id="inventoryList"></div>
            <button class="save-btn" onclick="saveInventory()">💾 儲存庫存數值</button>
            <button onclick="closeModal('inventoryModal')" style="margin-top:10px; border:none; background:none;">取消</button>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>📜 歷史紀錄 / 退單</h3></div>
            <div class="modal-body" id="modalListContent"></div>
            <button onclick="closeModal('historyModal')" style="margin-top:10px; padding:15px; width:100%; border-radius:10px;">關閉</button>
        </div>
    </div>

    <div id="role-select">
        <h2 style="text-align:center; color:#2c3e50;">TkFoodLab V22.2</h2>
        <button class="role-btn" style="background:#3498db;" onclick="selectRole('pos')">🏪 收銀 (POS)</button>
        <button class="role-btn" style="background:#e67e22;" onclick="selectRole('kitchen')">👨‍🍳 廚房 (Kitchen)</button>
    </div>

    <div id="pos-view">
        <div class="pos-header">
            <button class="settings-btn" onclick="openProductEditor()">📝 管理產品</button>
            <button class="settings-btn" onclick="openInventory()">📦 庫存</button>
        </div>

        <div class="display">
            <span class="order-id-display">NEXT: <span id="nextOrderNum">...</span></span>
            <span id="priceDisplay">£ 0.00</span>
        </div>
        
        <div class="grid" id="menuGrid"></div>

        <div class="history-box"><strong id="log" style="color:#7f8c8d;">空</strong></div>

        <div class="payment-grid">
            <button class="btn-sumup" onclick="payWithSumUp()">💳 SumUp 支付</button>
            <button class="btn-cash" onclick="payWithCash()">💵 現金收銀</button>
            <button class="btn-clear" onclick="nextCustomer()">❌ 清除</button>
        </div>
        
        <div class="admin-section">
            <div class="stat-row" style="color:#27ae60;">Cash Total: <span id="cashTotal">£ 0.00</span></div>
            <div class="stat-row" style="color:#0053a0;">SumUp Total: <span id="sumupTotal">£ 0.00</span></div>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="downloadCSV()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#7f8c8d; color:white;">📥 流水帳</button>
                <button onclick="downloadRankCSV()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#27ae60; color:white;">📊 排名榜</button>
            </div>
            
            <button onclick="showPosHistory()" style="width:100%; padding:12px; margin-top:12px; background:#34495e; color:white; border:none; border-radius:8px;">📜 查看紀錄 / 作廢退單</button>
            <button onclick="clearAllData()" style="width:100%; padding:8px; margin-top:20px; background:#eee; border:none; border-radius:8px; font-size:0.8em; color:#999;">🔴 收市清機 (Reset All Data)</button>
        </div>
    </div>

    <div id="kitchen-view" style="display:none; width:100%; max-width:600px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>👨‍🍳 廚房接單</h2>
            <button onclick="undoLastKitchenOrder()" style="padding:10px; background:#f39c12; color:white; border:none; border-radius:8px;">↩️ 復原出餐</button>
        </div>
        <div id="ticket-list"></div>
    </div>

    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwf89HosgmxTH4daR_IIdzKMBwhxxTx3E",
            authDomain: "tkfoodlab-94f22.firebaseapp.com",
            databaseURL: "https://tkfoodlab-94f22-default-rtdb.firebaseio.com",
            projectId: "tkfoodlab-94f22",
            storageBucket: "tkfoodlab-94f22.firebasestorage.app",
            messagingSenderId: "849545681320",
            appId: "1:849545681320:web:e7a95fb424809d3573659d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let menuItems = [];
        let currentOrder = [];
        let dailyStats = { cash: 0, sumup: 0, orderCount: 1 };
        let cloudInventory = {};
        let cloudSalesLog = [];

        function initGlobalListeners() {
            db.ref('menuConfig').on('value', snap => { 
                menuItems = snap.val() || []; 
                renderMenu(); 
            });
            db.ref('dailyStats').on('value', snap => { 
                dailyStats = snap.val() || { cash: 0, sumup: 0, orderCount: 1 }; 
                updateUI(); 
            });
            db.ref('inventory').on('value', snap => { 
                cloudInventory = snap.val() || {}; 
                renderMenu(); 
            });
            db.ref('salesLog').on('value', snap => {
                const val = snap.val();
                cloudSalesLog = val ? Object.entries(val).map(([k, v]) => ({...v, key: k})).sort((a,b)=>b.timestamp-a.timestamp) : [];
            });
        }

        // --- 核心 POS 渲染 ---
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            if(!grid) return;
            grid.innerHTML = '';
            menuItems.forEach(item => {
                let btn = document.createElement('button');
                btn.className = `item-btn btn-${item.type || 'food'}`;
                let sId = item.stockId || item.id;
                let stock = cloudInventory[sId];
                let stockText = (stock !== undefined) ? `<span class="stock-tag">剩 ${stock}</span>` : '';
                btn.innerHTML = `<span>${item.name}</span><span class="item-price">£${Number(item.price).toFixed(2)}</span>${stockText}`;
                btn.onclick = () => { currentOrder.push(item); updateUI(); };
                grid.appendChild(btn);
            });
            let ub = document.createElement('button');
            ub.className = 'item-btn btn-undo'; ub.innerHTML = '🔙 UNDO (刪除上一項)';
            ub.onclick = () => { currentOrder.pop(); updateUI(); };
            grid.appendChild(ub);
        }

        function updateUI() {
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            document.getElementById('priceDisplay').innerText = '£ ' + total.toFixed(2);
            document.getElementById('log').innerText = currentOrder.map(i => i.name).join(' + ') || '空';
            document.getElementById('nextOrderNum').innerText = '#' + String(dailyStats.orderCount || 1).padStart(3, '0');
            document.getElementById('cashTotal').innerText = '£ ' + Number(dailyStats.cash).toFixed(2);
            document.getElementById('sumupTotal').innerText = '£ ' + Number(dailyStats.sumup).toFixed(2);
        }

        // --- 產品管理 (新增/修改) ---
        function openProductEditor() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            menuItems.forEach((item, index) => {
                list.innerHTML += `
                <div class="edit-card">
                    <div style="display:flex; gap:5px; margin-bottom:5px;">
                        <input type="text" id="p-name-${index}" value="${item.name}" style="flex:2; padding:8px;" placeholder="名稱">
                        <input type="number" id="p-price-${index}" value="${item.price}" style="flex:1; padding:8px;" placeholder="價錢">
                    </div>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <select id="p-type-${index}" style="flex:1; padding:8px;">
                            <option value="food" ${item.type==='food'?'selected':''}>小食 (黃)</option>
                            <option value="drink" ${item.type==='drink'?'selected':''}>飲品 (藍)</option>
                            <option value="combo" ${item.type==='combo'?'selected':''}>套餐 (綠)</option>
                        </select>
                        <input type="text" id="p-stockid-${index}" value="${item.stockId || ''}" style="flex:1; padding:8px;" placeholder="庫存ID (選填)">
                        <button onclick="removeProductRow(${index})" style="background:none; border:none; font-size:1.2em;">🗑️</button>
                    </div>
                </div>`;
            });
            document.getElementById('productModal').style.display = 'flex';
        }

        function addNewProductRow() {
            // 先將畫面上的暫存落去 menuItems
            saveTempInputs();
            menuItems.push({ id: 'item_' + Date.now(), name: '🆕 新產品', price: 0, type: 'food', stockId: '' });
            openProductEditor();
        }

        function removeProductRow(index) {
            if(confirm("確定刪除此產品？")) {
                saveTempInputs();
                menuItems.splice(index, 1);
                openProductEditor();
            }
        }

        function saveTempInputs() {
            menuItems.forEach((item, index) => {
                const nameEl = document.getElementById(`p-name-${index}`);
                if(nameEl) {
                    item.name = nameEl.value;
                    item.price = document.getElementById(`p-price-${index}`).value;
                    item.type = document.getElementById(`p-type-${index}`).value;
                    item.stockId = document.getElementById(`p-stockid-${index}`).value;
                }
            });
        }

        function saveProductConfig() {
            saveTempInputs();
            db.ref('menuConfig').set(menuItems).then(() => {
                alert("產品清單已同步到所有裝置！");
                closeModal('productModal');
            });
        }

        // --- 交易處理 ---
        function payWithCash() { processTransaction('Cash'); }
        function payWithSumUp() {
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            if(total <= 0) return;
            processTransaction('SumUp');
            window.location.href = `sumupmerchant://pay/1.0?amount=${total.toFixed(2)}&currency=GBP&affiliate-key=sup_afk_0iCXN24RDImFTW7FuzTeIzZLgpY81W9n&app-id=app.netlify.tkfoodlab`;
        }

        function processTransaction(method) {
            if (currentOrder.length === 0) return;
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            const itemsStr = currentOrder.map(i => i.name).join(' + ');
            
            db.ref('dailyStats').transaction(stats => {
                if(stats) {
                    if(method==='Cash') stats.cash += total; else stats.sumup += total;
                    stats.orderCount++;
                }
                return stats;
            }, (err, ok, snap) => {
                if(ok) {
                    const id = String(snap.val().orderCount - 1).padStart(3,'0');
                    const timestamp = Date.now();
                    const time = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
                    
                    db.ref('salesLog').push({ id, time, items: itemsStr, amount: total.toFixed(2), method, timestamp });
                    db.ref('orders').push({ id, items: itemsStr, time, timestamp });
                    
                    // 扣庫存
                    db.ref('inventory').transaction(inv => {
                        if(inv) currentOrder.forEach(o => { 
                            let sid = o.stockId || o.id; 
                            if(inv[sid] !== undefined) inv[sid]--; 
                        });
                        return inv;
                    });

                    document.getElementById('cashSound').play().catch(e=>{});
                    currentOrder = []; updateUI();
                }
            });
        }

        // --- 報表與歷史 ---
        function downloadCSV() {
            if (cloudSalesLog.length === 0) return;
            let csv = "\uFEFF單號,時間,內容,金額,方式\n";
            cloudSalesLog.forEach(r => { csv += `#${r.id},${r.time},"${r.items}",£${r.amount},${r.method}\n`; });
            downloadFile(csv, `sales_${new Date().toISOString().slice(0,10)}.csv`);
        }

        function downloadRankCSV() {
            let stats = {};
            cloudSalesLog.forEach(log => {
                log.items.split(' + ').forEach(name => { stats[name] = (stats[name] || 0) + 1; });
            });
            let csv = "\uFEFF產品,數量\n";
            Object.entries(stats).sort((a,b)=>b[1]-a[1]).forEach(x => { csv += `"${x[0]}",${x[1]}\n`; });
            downloadFile(csv, `rank_${new Date().toISOString().slice(0,10)}.csv`);
        }

        function downloadFile(content, filename) {
            let blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        function showPosHistory() {
            let list = document.getElementById('modalListContent');
            list.innerHTML = cloudSalesLog.length ? cloudSalesLog.map(l => `
                <div style="border-bottom:1px solid #eee; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:0.9em;"><b>#${l.id} - £${l.amount}</b> (${l.method})<br>${l.items}</div>
                    <button class="void-btn" onclick='deleteOrder("${l.key}", ${JSON.stringify(l)})'>作廢</button>
                </div>
            `).join('') : '<p style="text-align:center; color:#999;">暫無紀錄</p>';
            document.getElementById('historyModal').style.display = 'flex';
        }

        function deleteOrder(key, data) {
            if(!confirm(`⚠️ 確定作廢單號 #${data.id}？金額將扣除並補回庫存。`)) return;
            db.ref('dailyStats').transaction(s => {
                if(s) {
                    if(data.method==='Cash') s.cash -= parseFloat(data.amount);
                    else s.sumup -= parseFloat(data.amount);
                }
                return s;
            });
            db.ref('inventory').transaction(inv => {
                if(!inv) return inv;
                data.items.split(' + ').forEach(name => {
                    let match = menuItems.find(m => m.name === name);
                    if(match) {
                        let sid = match.stockId || match.id;
                        if(inv[sid] !== undefined) inv[sid]++;
                    }
                });
                return inv;
            });
            db.ref('salesLog').child(key).remove();
            alert("已作廢。");
            closeModal('historyModal');
        }

        // --- 庫存 ---
        function openInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            let seen = {};
            menuItems.forEach(item => {
                let sid = item.stockId || item.id;
                if(seen[sid]) return; seen[sid] = true;
                let val = cloudInventory[sid] ?? '';
                list.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                    <span>${item.name}</span>
                    <input type="number" id="inv-${sid}" value="${val}" style="width:80px; padding:8px;">
                </div>`;
            });
            document.getElementById('inventoryModal').style.display = 'flex';
        }

        function saveInventory() {
            let newInv = {};
            let seen = {};
            menuItems.forEach(item => {
                let sid = item.stockId || item.id;
                if(seen[sid]) return; seen[sid] = true;
                let input = document.getElementById(`inv-${sid}`);
                if(input && input.value !== '') newInv[sid] = parseInt(input.value);
            });
            db.ref('inventory').set(newInv).then(() => closeModal('inventoryModal'));
        }

        // --- 其他工具 ---
        function selectRole(role) {
            document.getElementById('role-select').style.display = 'none';
            initGlobalListeners();
            if(role==='pos') {
                document.getElementById('pos-view').style.display='flex';
            } else {
                document.getElementById('kitchen-view').style.display='flex';
                initKitchenListener();
            }
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function nextCustomer() { currentOrder = []; updateUI(); }
        function clearAllData() {
            if(confirm('🔴 警告：將清空今日所有營業額及紀錄！(產品清單會保留)')) {
                db.ref('dailyStats').set({ cash: 0, sumup: 0, orderCount: 1 });
                db.ref('salesLog').remove();
                db.ref('orders').remove();
            }
        }

        function initKitchenListener() {
            const list = document.getElementById('ticket-list');
            db.ref('orders').on('child_added', snap => {
                const order = snap.val();
                const card = document.createElement('div');
                card.className = 'edit-card'; card.id = 'k-' + snap.key;
                card.style.background = "#fff"; card.style.borderLeft = "10px solid #e67e22";
                card.innerHTML = `
                    <div style="font-size:1.5em; font-weight:bold; color:#e67e22;">#${order.id} <small style="color:#999; font-size:0.5em;">${order.time}</small></div>
                    <div style="font-size:1.3em; margin:10px 0; font-weight:bold;">${order.items}</div>
                    <button onclick="completeKitchenOrder('${snap.key}')" style="width:100%; padding:12px; background:#27ae60; color:white; border:none; border-radius:8px; font-weight:bold; font-size:1.1em;">✅ 出餐 Done</button>
                `;
                list.prepend(card);
            });
            db.ref('orders').on('child_removed', snap => {
                const el = document.getElementById('k-' + snap.key);
                if(el) el.remove();
            });
        }
        function completeKitchenOrder(key) { db.ref('orders').child(key).remove(); }
    </script>
</body>
</html>
