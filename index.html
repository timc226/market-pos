<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TkFoodLab V24.1 (Final Fix)</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* --- 核心 UI 樣式 --- */
        * { touch-action: manipulation; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #role-select { display: flex; flex-direction: column; gap: 20px; margin-top: 100px; width: 100%; max-width: 300px; }
        .role-btn { padding: 30px; font-size: 1.5em; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: bold; }
        
        #pos-view, #kitchen-view { display: none; width: 100%; max-width: 420px; flex-direction: column; }
        .display { background: #2c3e50; color: #fff; width: 100%; padding: 20px; text-align: right; font-size: 2.5em; font-weight: bold; border-radius: 15px; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .item-btn { padding: 10px; font-size: 1.1em; border: none; border-radius: 10px; color: white; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 85px; box-shadow: 0 3px 0 rgba(0,0,0,0.1); }
        .btn-food { background: #f39c12; } .btn-drink { background: #3498db; } .btn-combo { background: #27ae60; } .btn-undo { background: #f1c40f; color: #333; grid-column: span 2; }
        .stock-tag { font-size: 0.7em; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
        .history-box { width: 100%; margin: 10px 0; background: #fff; border: 2px solid #3498db; padding: 10px; border-radius: 12px; min-height: 60px; }
        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .btn-sumup { background: #0053a0; grid-column: span 2; padding: 18px; color:white; border:none; border-radius:10px; font-weight:bold; font-size:1.2em; }
        .btn-cash { background: #27ae60; padding: 15px; color:white; border:none; border-radius:10px; font-weight:bold; }
        .btn-clear { background: #e74c3c; padding: 15px; color:white; border:none; border-radius:10px; font-weight:bold; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 95%; max-width: 480px; height: 85%; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; -webkit-user-select: text; user-select: text; }
        .modal-body { flex: 1; overflow-y: auto; }
        .edit-card { border: 1px solid #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; display: flex; gap: 10px; }

        /* --- 🖨️ 列印樣式修正 --- */
        #receipt-print-area { display: none; }
       /* --- 修正版：針對 iPhone / 58mm 熱敏紙 --- */
@media print {
    /* 1. 話俾瀏覽器知紙張大細 */
    @page {
        size: 58mm auto; /* 指定闊度 58mm，長度根據內容自動延伸 */
        margin: 0;       /* 移除邊距 */
    }

    /* 2. 徹底隱藏網頁上唔需要印嘅嘢 */
    body {
        background: white !important;
        margin: 0;
        padding: 0;
    }
    
    #role-select, #pos-view, #kitchen-view, .modal-overlay, .admin-section, .settings-btn { 
        display: none !important; 
    }

    /* 3. 設定收據區域 */
    #receipt-print-area { 
        display: block !important; 
        visibility: visible !important;
        position: static; /* 喺 iPhone 建議用 static 或 relative 代替 absolute */
        width: 58mm !important; 
        padding: 8mm 4mm !important; /* 左右留少少白，避免印唔到邊位 */
        margin: 0 auto;
        color: black !important;
        background: white !important;
    }

    /* 4. 確保文字排版 */
    .receipt-row { 
        display: flex !important; 
        justify-content: space-between !important; 
        width: 100% !important; 
        font-family: monospace; 
        font-size: 14px; 
        margin-bottom: 4px;
        visibility: visible !important;
    }

    #r-items-list *, .receipt-header *, .receipt-total * {
        visibility: visible !important;
    }

    .receipt-header { text-align: center; border-bottom: 1px dashed black; margin-bottom: 10px; padding-bottom: 5px; }
    .receipt-total { border-top: 1px dashed black; margin-top: 10px; padding-top: 5px; font-weight: bold; }
}
    </style>
</head>
<body>

    <!-- 收據列印區 -->
    <div id="receipt-print-area">
        <div class="receipt-header">
            <h2 style="margin:0;">TkFoodLab</h2>
            <p id="r-time" style="font-size:12px; margin:5px 0;"></p>
            <p style="margin:0;">Order: <span id="r-id" style="font-size:22px;"></span></p>
        </div>
        <div id="r-items-list"></div>
        <div class="receipt-total">
            <div class="receipt-row"><span>TOTAL:</span><span id="r-total"></span></div>
            <div class="receipt-row" style="font-weight:normal; font-size:12px;"><span>Method:</span><span id="r-method"></span></div>
        </div>
        <p style="text-align:center; font-size:11px; margin-top:15px;">Thank you for your support!</p>
    </div>

    <!-- 角色選擇 -->
    <div id="role-select">
        <h2 style="text-align:center;">TkFoodLab V24.1</h2>
        <button class="role-btn" style="background:#3498db;" onclick="selectRole('pos')">🏪 收銀 (POS)</button>
        <button class="role-btn" style="background:#e67e22;" onclick="selectRole('kitchen')">👨‍🍳 廚房 (Kitchen)</button>
    </div>

    <!-- POS 介面 -->
    <div id="pos-view">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button onclick="openProductEditor()" style="padding:8px 12px; border-radius:5px; border:none; background:#7f8c8d; color:white;">📝 管理產品</button>
            <button onclick="openInventory()" style="padding:8px 12px; border-radius:5px; border:none; background:#7f8c8d; color:white;">📦 庫存</button>
        </div>
        <div class="display">
            <span style="font-size:0.4em; display:block;">NEXT: <span id="nextOrderNum">...</span></span>
            <span id="priceDisplay">£ 0.00</span>
        </div>
        <div class="grid" id="menuGrid"></div>
        <div class="history-box"><strong id="log">空</strong></div>
        <div class="payment-grid">
            <button class="btn-sumup" onclick="payWithSumUp()">💳 SumUp 支付</button>
            <button class="btn-cash" onclick="payWithCash()">💵 現金收銀</button>
            <button class="btn-clear" onclick="nextCustomer()">❌ 清除</button>
        </div>
        <div style="margin-top:20px; border-top:1px dashed #ccc; padding-top:10px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px;">
                <span style="color:#27ae60;">Cash: <span id="cashTotal">£ 0.00</span></span>
                <span style="color:#0053a0;">SumUp: <span id="sumupTotal">£ 0.00</span></span>
            </div>
            <button onclick="showPosHistory()" style="width:100%; padding:12px; background:#34495e; color:white; border:none; border-radius:8px;">📜 歷史紀錄 / 退單印單</button>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick="downloadCSV()" style="flex:1; padding:8px;">📥 流水帳</button>
                <button onclick="downloadRankCSV()" style="flex:1; padding:8px;">📊 排名榜</button>
            </div>
            <button onclick="clearAllData()" style="width:100%; margin-top:20px; padding:5px; background:none; border:none; color:#bbb; font-size:0.8em;">🔴 Reset Today's Data</button>
        </div>
    </div>

    <!-- 廚房介面 -->
    <div id="kitchen-view">
        <h2>👨‍🍳 廚房接單</h2>
        <div id="ticket-list"></div>
    </div>

    <!-- Modals -->
    <div id="productModal" class="modal-overlay"><div class="modal-content"><h3>📝 產品排序及管理</h3><div class="modal-body" id="productList"></div><button onclick="addNewProductRow()" style="padding:10px; margin-top:10px;">➕ 新增</button><button class="save-btn" onclick="saveProductConfig()">💾 儲存同步</button><button onclick="closeModal('productModal')" style="margin-top:10px; border:none; background:none;">返回</button></div></div>
    <div id="inventoryModal" class="modal-overlay"><div class="modal-content"><h3>📦 庫存設定</h3><div class="modal-body" id="inventoryList"></div><button class="save-btn" onclick="saveInventory()">💾 儲存庫存</button><button onclick="closeModal('inventoryModal')" style="margin-top:10px; border:none; background:none;">返回</button></div></div>
    <div id="historyModal" class="modal-overlay"><div class="modal-content"><h3>📜 歷史紀錄</h3><div class="modal-body" id="modalListContent"></div><button onclick="closeModal('historyModal')" style="margin-top:10px; padding:15px; width:100%;">關閉</button></div></div>

    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAwf89HosgmxTH4daR_IIdzKMBwhxxTx3E",
            authDomain: "tkfoodlab-94f22.firebaseapp.com",
            databaseURL: "https://tkfoodlab-94f22-default-rtdb.firebaseio.com",
            projectId: "tkfoodlab-94f22",
            storageBucket: "tkfoodlab-94f22.firebasestorage.app",
            messagingSenderId: "849545681320",
            appId: "1:849545681320:web:e7a95fb424809d3573659d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let menuItems = [];
        let currentOrder = [];
        let dailyStats = { cash: 0, sumup: 0, orderCount: 1 };
        let cloudInventory = {};
        let cloudSalesLog = [];

        function initGlobalListeners() {
            db.ref('menuConfig').on('value', snap => { menuItems = snap.val() || []; renderMenu(); });
            db.ref('dailyStats').on('value', snap => { dailyStats = snap.val() || { cash: 0, sumup: 0, orderCount: 1 }; updateUI(); });
            db.ref('inventory').on('value', snap => { cloudInventory = snap.val() || {}; renderMenu(); });
            db.ref('salesLog').on('value', snap => {
                const val = snap.val();
                cloudSalesLog = val ? Object.entries(val).map(([k, v]) => ({...v, key: k})).sort((a,b)=>b.timestamp-a.timestamp) : [];
            });
        }

        // --- POS 渲染 ---
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            if(!grid) return;
            grid.innerHTML = '';
            menuItems.forEach(item => {
                let btn = document.createElement('button');
                btn.className = `item-btn btn-${item.type || 'food'}`;
                let sId = item.stockId || item.id;
                let stock = cloudInventory[sId];
                let stockText = (stock !== undefined) ? `<span class="stock-tag">剩 ${stock}</span>` : '';
                btn.innerHTML = `<span>${item.name}</span><span class="item-price">£${Number(item.price).toFixed(2)}</span>${stockText}`;
                btn.onclick = () => { currentOrder.push(item); updateUI(); };
                grid.appendChild(btn);
            });
            let ub = document.createElement('button');
            ub.className = 'item-btn btn-undo'; ub.innerHTML = '🔙 UNDO';
            ub.onclick = () => { currentOrder.pop(); updateUI(); };
            grid.appendChild(ub);
        }

        function updateUI() {
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            document.getElementById('priceDisplay').innerText = '£ ' + total.toFixed(2);
            document.getElementById('log').innerText = currentOrder.map(i => i.name).join(' + ') || '空';
            document.getElementById('nextOrderNum').innerText = '#' + String(dailyStats.orderCount || 1).padStart(3, '0');
            document.getElementById('cashTotal').innerText = '£ ' + Number(dailyStats.cash).toFixed(2);
            document.getElementById('sumupTotal').innerText = '£ ' + Number(dailyStats.sumup).toFixed(2);
        }

        // --- 🖨️ 列印函數 ---
        function printReceipt(data) {
            document.getElementById('r-id').innerText = data.id;
            document.getElementById('r-time').innerText = data.time || new Date().toLocaleTimeString();
            document.getElementById('r-method').innerText = data.method;
            document.getElementById('r-total').innerText = "£" + Number(data.amount).toFixed(2);
            const list = document.getElementById('r-items-list');
            list.innerHTML = data.items.split(' + ').map(i => `<div class="receipt-row"><span>${i}</span><span>1</span></div>`).join('');
            
            // 延遲 500ms 確保 DOM 資料已渲染
            setTimeout(() => { window.print(); }, 500);
        }

        // --- 交易過程 ---
        function payWithCash() { processTransaction('Cash'); }
        function payWithSumUp() {
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            if(total <= 0) return;
            processTransaction('SumUp');
            window.location.href = `sumupmerchant://pay/1.0?amount=${total.toFixed(2)}&currency=GBP&affiliate-key=sup_afk_0iCXN24RDImFTW7FuzTeIzZLgpY81W9n&app-id=app.netlify.tkfoodlab`;
        }

        function processTransaction(method) {
            if (currentOrder.length === 0) return;
            const total = currentOrder.reduce((s, i) => s + Number(i.price), 0);
            const itemsStr = currentOrder.map(i => i.name).join(' + ');
            
            db.ref('dailyStats').transaction(stats => {
                if(stats) {
                    if(method==='Cash') stats.cash += total; else stats.sumup += total;
                    stats.orderCount++;
                }
                return stats;
            }, (err, ok, snap) => {
                if(ok) {
                    const id = String(snap.val().orderCount - 1).padStart(3,'0');
                    const oData = { id, time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), items: itemsStr, amount: total.toFixed(2), method, timestamp: Date.now() };
                    db.ref('salesLog').push(oData);
                    db.ref('orders').push({ id, items: itemsStr, time: oData.time, timestamp: oData.timestamp });
                    db.ref('inventory').transaction(inv => {
                        if(inv) currentOrder.forEach(o => { let sid = o.stockId || o.id; if(inv[sid]!==undefined) inv[sid]--; });
                        return inv;
                    });
                    document.getElementById('cashSound').play().catch(e=>{});
                    if(confirm("交易成功！列印收據？")) printReceipt(oData);
                    currentOrder = []; updateUI();
                }
            });
        }

        // --- 管理功能 ---
        function openProductEditor() {
            const list = document.getElementById('productList');
            list.innerHTML = menuItems.map((item, i) => `
                <div class="edit-card">
                    <div style="display:flex; flex-direction:column; gap:5px;"><button onclick="moveItem(${i},-1)">▲</button><button onclick="moveItem(${i},1)">▼</button></div>
                    <div style="flex:1">
                        <input type="text" id="p-n-${i}" value="${item.name}" style="width:100%; margin-bottom:5px;">
                        <input type="number" id="p-p-${i}" value="${item.price}" style="width:60px;">
                        <select id="p-t-${i}"><option value="food" ${item.type==='food'?'selected':''}>小食</option><option value="drink" ${item.type==='drink'?'selected':''}>飲品</option></select>
                        <input type="text" id="p-s-${i}" value="${item.stockId||''}" style="width:70px" placeholder="庫存ID">
                        <button onclick="removeRow(${i})">🗑️</button>
                    </div>
                </div>`).join('');
            document.getElementById('productModal').style.display = 'flex';
        }
        function moveItem(idx, dir) { saveTemp(); let target = idx + dir; if(target >= 0 && target < menuItems.length) { [menuItems[idx], menuItems[target]] = [menuItems[target], menuItems[idx]]; openProductEditor(); } }
        function saveTemp() { menuItems.forEach((item, i) => { const n = document.getElementById(`p-n-${i}`); if(n) { item.name = n.value; item.price = document.getElementById(`p-p-${i}`).value; item.type = document.getElementById(`p-t-${i}`).value; item.stockId = document.getElementById(`p-s-${i}`).value; } }); }
        function addNewProductRow() { saveTemp(); menuItems.push({id:'item_'+Date.now(), name:'新產品', price:0, type:'food'}); openProductEditor(); }
        function removeRow(i) { if(confirm("刪除？")) { menuItems.splice(i,1); openProductEditor(); } }
        function saveProductConfig() { saveTemp(); db.ref('menuConfig').set(menuItems).then(() => closeModal('productModal')); }

        function showPosHistory() {
            let list = document.getElementById('modalListContent');
            list.innerHTML = cloudSalesLog.map(l => `
                <div style="border-bottom:1px solid #eee; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:0.8em;"><b>#${l.id} - £${l.amount}</b><br>${l.items}</div>
                    <div><button onclick='printReceipt(${JSON.stringify(l)})'>🖨️</button><button onclick='deleteOrder("${l.key}",${JSON.stringify(l)})'>🗑️</button></div>
                </div>`).join('') || '<p>無紀錄</p>';
            document.getElementById('historyModal').style.display = 'flex';
        }
        function deleteOrder(key, data) {
            if(!confirm(`作廢 #${data.id}？`)) return;
            db.ref('dailyStats').transaction(s => { if(s) { if(data.method==='Cash') s.cash -= parseFloat(data.amount); else s.sumup -= parseFloat(data.amount); } return s; });
            db.ref('inventory').transaction(inv => {
                if(inv) data.items.split(' + ').forEach(name => { let m = menuItems.find(mi => mi.name === name); if(m) { let sid = m.stockId || m.id; if(inv[sid]!==undefined) inv[sid]++; } });
                return inv;
            });
            db.ref('salesLog').child(key).remove(); closeModal('historyModal');
        }

        // --- 基礎工具 ---
        function selectRole(r) { document.getElementById('role-select').style.display='none'; initGlobalListeners(); document.getElementById(r+'-view').style.display='flex'; if(r==='kitchen') initKitchen(); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function nextCustomer() { currentOrder=[]; updateUI(); }
        function openInventory() { /* 省略內容，同之前庫存邏輯 */ const list = document.getElementById('inventoryList'); list.innerHTML = ''; let seen = {}; menuItems.forEach(item => { let sid = item.stockId || item.id; if(seen[sid]) return; seen[sid] = true; list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${item.name}</span><input type="number" id="inv-${sid}" value="${cloudInventory[sid]??''}" style="width:80px;"></div>`; }); document.getElementById('inventoryModal').style.display = 'flex'; }
        function saveInventory() { let newInv = {}; menuItems.forEach(item => { let sid = item.stockId || item.id; let v = document.getElementById(`inv-${sid}`); if(v && v.value!=='') newInv[sid] = parseInt(v.value); }); db.ref('inventory').set(newInv).then(() => closeModal('inventoryModal')); }
        function downloadCSV() { let csv = "\uFEFF單號,時間,內容,金額,方式\n"; cloudSalesLog.forEach(r => { csv += `#${r.id},${r.time},"${r.items}",£${r.amount},${r.method}\n`; }); let blob = new Blob([csv], {type:'text/csv'}); let link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'sales.csv'; link.click(); }
        function downloadRankCSV() { let s = {}; cloudSalesLog.forEach(l => l.items.split(' + ').forEach(n => s[n] = (s[n]||0)+1)); let csv = "\uFEFF產品,數量\n"; Object.entries(s).sort((a,b)=>b[1]-a[1]).forEach(x => csv += `"${x[0]}",${x[1]}\n`); let blob = new Blob([csv], {type:'text/csv'}); let link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'rank.csv'; link.click(); }
        function clearAllData() { if(confirm("清空數據？")) { db.ref('dailyStats').set({cash:0,sumup:0,orderCount:1}); db.ref('salesLog').remove(); db.ref('orders').remove(); } }
        function initKitchen() { db.ref('orders').on('child_added', snap => { const o = snap.val(); const card = document.createElement('div'); card.id = 'k-'+snap.key; card.style = "background:#fff; border-left:10px solid #e67e22; padding:15px; margin-bottom:10px; border-radius:8px;"; card.innerHTML = `<div style="font-size:1.5em; font-weight:bold;">#${o.id}</div><div style="font-size:1.2em; margin:10px 0;">${o.items}</div><button onclick="db.ref('orders').child('${snap.key}').remove()" style="width:100%; padding:10px; background:#27ae60; color:white; border:none; border-radius:8px;">✅ Done</button>`; document.getElementById('ticket-list').prepend(card); }); db.ref('orders').on('child_removed', snap => { const el = document.getElementById('k-'+snap.key); if(el) el.remove(); }); }
    </script>
</body>
</html>
