<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TkFoodLab V22 (Admin POS)</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { touch-action: manipulation; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #role-select { display: flex; flex-direction: column; gap: 20px; margin-top: 100px; width: 100%; max-width: 300px; }
        .role-btn { padding: 30px; font-size: 1.5em; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: bold; }
        
        #pos-view { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; padding-bottom: 200px; }
        .pos-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .settings-btn { background: #7f8c8d; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.9em; cursor: pointer; }

        .display { background: #2c3e50; color: #fff; width: 100%; padding: 20px; text-align: right; font-size: 2.5em; font-weight: bold; border-radius: 15px; margin-bottom: 10px; }
        .order-id-display { font-size: 0.4em; color: #ecf0f1; display: block; margin-bottom: 5px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
        .item-btn { padding: 10px 5px; font-size: 1.1em; border: none; border-radius: 10px; color: white; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; box-shadow: 0 3px 0 rgba(0,0,0,0.1); position: relative; }
        .item-btn:active { transform: translateY(2px); box-shadow: none; }
        .item-name { font-size: 1em; }
        .item-price { font-size: 0.8em; opacity: 0.9; }
        .stock-tag { font-size: 0.7em; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
        
        .btn-food { background: #f39c12; } 
        .btn-drink { background: #3498db; } 
        .btn-combo { background: #27ae60; } 
        .btn-undo { background: #f1c40f; color: #333; grid-column: span 2; margin-top: 5px; }

        .low-stock { background: #e67e22 !important; border: 2px solid #c0392b; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
        
        .history-box { width: 100%; margin: 10px 0; background: #fff; border: 2px solid #3498db; padding: 10px; border-radius: 12px; max-height: 150px; overflow-y: auto; font-size: 1.1em; }
        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
        .btn-sumup { background: #0053a0; grid-column: span 2; padding: 20px; font-size: 1.3em; color:white; border:none; border-radius:10px; font-weight:bold; } 
        .btn-cash { background: #27ae60; padding: 15px; font-size: 1.1em; color:white; border:none; border-radius:10px; font-weight:bold;} 
        .btn-clear { background: #e74c3c; padding: 15px; font-size: 1.1em; color:white; border:none; border-radius:10px; font-weight:bold;}

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 95%; max-width: 450px; height: 85%; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; }
        .modal-header { font-size: 1.3em; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding-right: 5px; }
        
        /* Product Editor Style */
        .prod-edit-card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; position: relative; }
        .edit-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .edit-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; }
        .btn-del-prod { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; }

        .save-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1em; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .close-btn { background: #95a5a6; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }

        /* Kitchen View */
        #kitchen-view { display: none; width: 100%; max-width: 600px; flex-direction: column; gap: 15px; padding-bottom: 50px; }
        .ticket { background: #fff; border-left: 10px solid #e67e22; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .ticket-id { font-size: 2em; font-weight: bold; color: #e67e22; }
        .ticket-items { font-size: 1.4em; font-weight: bold; color: #2c3e50; line-height: 1.4; }
        .btn-done { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 1.2em; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📝 產品清單管理</span>
                <button class="close-btn" onclick="closeModal('productModal')">關閉</button>
            </div>
            <div class="modal-body" id="productList"></div>
            <button onclick="addNewProductRow()" style="background:#3498db; color:white; border:none; padding:10px; border-radius:8px; margin-top:10px;">➕ 新增產品</button>
            <button class="save-btn" onclick="saveProductConfig()">💾 儲存並同步選單</button>
        </div>
    </div>

    <div id="inventoryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📦 庫存設定</span>
                <button class="close-btn" onclick="closeModal('inventoryModal')">取消</button>
            </div>
            <div class="modal-body" id="inventoryList"></div>
            <button class="save-btn" onclick="saveInventory()">💾 儲存庫存</button>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">📜 紀錄</span>
                <button class="close-btn" onclick="closeModal('historyModal')">關閉</button>
            </div>
            <div class="modal-body" id="modalListContent"></div>
        </div>
    </div>

    <div id="role-select">
        <h2 style="text-align:center; color:#555;">TkFoodLab V22</h2>
        <button class="role-btn" style="background:#3498db;" onclick="selectRole('pos')">🏪 收銀 (POS)</button>
        <button class="role-btn" style="background:#e67e22;" onclick="selectRole('kitchen')">👨‍🍳 廚房 (Kitchen)</button>
    </div>

    <div id="pos-view">
        <div class="pos-header">
            <button class="settings-btn" onclick="openProductEditor()">📝 修改產品</button>
            <button class="settings-btn" onclick="openInventory()">📦 庫存</button>
        </div>

        <div class="display" id="total">
            <span class="order-id-display">NEXT: <span id="nextOrderNum">...</span></span>
            <span id="priceDisplay">£ 0.00</span>
        </div>
        
        <div class="grid" id="menuGrid"></div>

        <div class="history-box">
            <strong id="log">空</strong>
        </div>

        <div class="payment-grid">
            <button class="btn-sumup" onclick="payWithSumUp()">💳 SumUp</button>
            <button class="btn-cash" onclick="payWithCash()">💵 Cash</button>
            <button class="btn-clear" onclick="nextCustomer()">❌ 清除</button>
        </div>
        
        <div style="width:100%; margin-top:15px;">
            <button onclick="showPosHistory()" style="background:#34495e; color:#fff; font-size:1em; padding:12px; width:100%; border:none; border-radius:8px;">📜 管理訂單 / 退單</button>
        </div>
    </div>

    <div id="kitchen-view">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>👨‍🍳 廚房待辦</h2>
            <button onclick="undoLastOrder()" style="padding:8px; background:#f39c12; color:white; border:none; border-radius:5px;">↩️ Undo</button>
        </div>
        <div id="ticket-list"></div>
    </div>

    <audio id="cashSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        // 初始化 Firebase (使用你原本的 Config)
        const firebaseConfig = {
            apiKey: "AIzaSyAwf89HosgmxTH4daR_IIdzKMBwhxxTx3E",
            authDomain: "tkfoodlab-94f22.firebaseapp.com",
            databaseURL: "https://tkfoodlab-94f22-default-rtdb.firebaseio.com",
            projectId: "tkfoodlab-94f22",
            storageBucket: "tkfoodlab-94f22.firebasestorage.app",
            messagingSenderId: "849545681320",
            appId: "1:849545681320:web:e7a95fb424809d3573659d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let menuItems = []; // 由 Firebase 加載
        let currentRole = '';
        let currentOrder = [];
        let dailyStats = { cash: 0, sumup: 0, orderCount: 1 };
        let cloudInventory = {};
        let cloudSalesLog = [];
        let kitchenHistory = [];

        function playCashSound() { document.getElementById('cashSound').play().catch(e=>{}); }

        function initGlobalListeners() {
            // 監聽產品清單
            db.ref('menuConfig').on('value', snapshot => {
                const val = snapshot.val();
                if(val) {
                    menuItems = val;
                } else {
                    // 預設初始數據
                    menuItems = [{ id: 'item1', name: '🍢 沙爹', price: 5.0, type: 'food' }];
                }
                renderMenu();
            });

            db.ref('dailyStats').on('value', snapshot => {
                dailyStats = snapshot.val() || { cash: 0, sumup: 0, orderCount: 1 };
                updateUI();
            });

            db.ref('inventory').on('value', snapshot => {
                cloudInventory = snapshot.val() || {};
                renderMenu();
            });

            db.ref('salesLog').on('value', snapshot => {
                const val = snapshot.val();
                cloudSalesLog = val ? Object.entries(val).map(([k, v]) => ({...v, key: k})).sort((a,b)=>b.timestamp-a.timestamp) : [];
            });
        }

        function selectRole(role) {
            currentRole = role;
            document.getElementById('role-select').style.display = 'none';
            initGlobalListeners();
            if (role === 'pos') {
                document.getElementById('pos-view').style.display = 'flex';
            } else {
                document.getElementById('kitchen-view').style.display = 'flex';
                initKitchenListener();
            }
        }

        // --- 產品管理邏輯 ---
        function openProductEditor() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            menuItems.forEach((item, index) => {
                list.innerHTML += `
                    <div class="prod-edit-card" id="edit-card-${index}">
                        <div class="edit-row">
                            <input type="text" class="edit-input" style="flex:2" value="${item.name}" id="p-name-${index}" placeholder="產品名稱 (連Emoji)">
                            <input type="number" class="edit-input" style="flex:1" value="${item.price}" id="p-price-${index}" placeholder="價錢">
                        </div>
                        <div class="edit-row">
                            <select class="edit-input" style="flex:1" id="p-type-${index}">
                                <option value="food" ${item.type==='food'?'selected':''}>小食 (黃)</option>
                                <option value="drink" ${item.type==='drink'?'selected':''}>飲品 (藍)</option>
                                <option value="combo" ${item.type==='combo'?'selected':''}>套餐 (綠)</option>
                            </select>
                            <input type="text" class="edit-input" style="flex:1" value="${item.stockId || ''}" id="p-stock-${index}" placeholder="共用庫存ID">
                            <button class="btn-del-prod" onclick="removeProductRow(${index})">刪除</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('productModal').style.display = 'flex';
        }

        function addNewProductRow() {
            menuItems.push({ id: 'item_' + Date.now(), name: '🆕 新產品', price: 0, type: 'food' });
            openProductEditor();
        }

        function removeProductRow(index) {
            if(confirm("確定刪除此產品？")) {
                menuItems.splice(index, 1);
                openProductEditor();
            }
        }

        function saveProductConfig() {
            let updatedMenu = [];
            menuItems.forEach((item, index) => {
                const name = document.getElementById(`p-name-${index}`).value;
                const price = parseFloat(document.getElementById(`p-price-${index}`).value) || 0;
                const type = document.getElementById(`p-type-${index}`).value;
                const stockId = document.getElementById(`p-stock-${index}`).value;
                updatedMenu.push({ id: item.id, name, price, type, stockId });
            });
            db.ref('menuConfig').set(updatedMenu).then(() => {
                alert("選單已更新！");
                closeModal('productModal');
            });
        }

        // --- POS 運作邏輯 ---
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            if(!grid) return;
            grid.innerHTML = '';
            menuItems.forEach(item => {
                let btn = document.createElement('button');
                btn.className = `item-btn btn-${item.type}`;
                let sId = item.stockId || item.id;
                let stock = cloudInventory[sId];
                let stockText = (stock !== undefined) ? `<span class="stock-tag">剩 ${stock}</span>` : '';
                if (stock <= 5) btn.classList.add('low-stock');

                btn.innerHTML = `
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">£${item.price.toFixed(2)}</span>
                    ${stockText}
                `;
                btn.onclick = () => { currentOrder.push(item); updateUI(); };
                grid.appendChild(btn);
            });
            
            let undoBtn = document.createElement('button');
            undoBtn.className = 'item-btn btn-undo';
            undoBtn.innerHTML = '🔙 UNDO';
            undoBtn.onclick = () => { currentOrder.pop(); updateUI(); };
            grid.appendChild(undoBtn);
        }

        function updateUI() {
            const total = currentOrder.reduce((s, i) => s + i.price, 0);
            document.getElementById('priceDisplay').innerText = '£ ' + total.toFixed(2);
            document.getElementById('log').innerText = currentOrder.map(i => i.name).join(' + ') || '空';
            document.getElementById('nextOrderNum').innerText = '#' + String(dailyStats.orderCount || 1).padStart(3, '0');
        }

        function processTransaction(method) {
            if (currentOrder.length === 0) return;
            const total = currentOrder.reduce((s, i) => s + i.price, 0);
            const itemsStr = currentOrder.map(i => i.name).join(' + ');
            const time = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
            const timestamp = Date.now();

            db.ref('dailyStats').transaction(stats => {
                if (!stats) return stats;
                if (method === 'Cash') stats.cash += total; else stats.sumup += total;
                let orderNum = stats.orderCount;
                stats.orderCount++;
                return stats;
            }, (err, committed, snap) => {
                if(committed) {
                    const finalID = String(snap.val().orderCount - 1).padStart(3, '0');
                    db.ref('salesLog').push({ id: finalID, time, items: itemsStr, amount: total.toFixed(2), method, timestamp });
                    db.ref('orders').push({ id: finalID, items: itemsStr, time, timestamp });
                    
                    // 扣庫存
                    const invRef = db.ref('inventory');
                    invRef.transaction(inv => {
                        if(!inv) return inv;
                        currentOrder.forEach(oi => {
                            let sid = oi.stockId || oi.id;
                            if(inv[sid] !== undefined) inv[sid]--;
                        });
                        return inv;
                    });

                    currentOrder = [];
                    updateUI();
                    playCashSound();
                }
            });
        }

        function payWithCash() { processTransaction('Cash'); }
        function payWithSumUp() {
            const total = currentOrder.reduce((s, i) => s + i.price, 0);
            const url = `sumupmerchant://pay/1.0?amount=${total.toFixed(2)}&currency=GBP&affiliate-key=sup_afk_0iCXN24RDImFTW7FuzTeIzZLgpY81W9n&app-id=app.netlify.tkfoodlab`;
            processTransaction('SumUp');
            setTimeout(() => { window.location.href = url; }, 500);
        }

        function nextCustomer() { currentOrder = []; updateUI(); }

        // --- 庫存設定 ---
        function openInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            let seen = {};
            menuItems.forEach(item => {
                let sid = item.stockId || item.id;
                if(seen[sid]) return; seen[sid] = true;
                let val = cloudInventory[sid] ?? '';
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span>${item.name}</span>
                        <input type="number" class="edit-input" style="width:80px" id="inv-${sid}" value="${val}">
                    </div>
                `;
            });
            document.getElementById('inventoryModal').style.display = 'flex';
        }

        function saveInventory() {
            let newInv = {};
            menuItems.forEach(item => {
                let sid = item.stockId || item.id;
                let input = document.getElementById(`inv-${sid}`);
                if(input && input.value !== '') newInv[sid] = parseInt(input.value);
            });
            db.ref('inventory').set(newInv).then(() => { closeModal('inventoryModal'); });
        }

        // --- 廚房與通用 ---
        function initKitchenListener() {
            const list = document.getElementById('ticket-list');
            db.ref('orders').on('child_added', snap => {
                const order = snap.val();
                const card = document.createElement('div');
                card.className = 'ticket'; card.id = snap.key;
                card.innerHTML = `
                    <div class="ticket-id">#${order.id}</div>
                    <div class="ticket-items">${order.items}</div>
                    <div style="text-align:right; margin-top:10px;">
                        <button class="btn-done" onclick="completeOrder('${snap.key}')">✅ Done</button>
                    </div>
                `;
                list.prepend(card);
            });
            db.ref('orders').on('child_removed', snap => {
                const el = document.getElementById(snap.key);
                if(el) el.remove();
            });
        }

        function completeOrder(key) { db.ref('orders').child(key).remove(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showPosHistory() {
            let content = document.getElementById('modalListContent');
            content.innerHTML = cloudSalesLog.map(l => `
                <div style="border-bottom:1px solid #eee; padding:10px;">
                    <b>#${l.id} [${l.method}] £${l.amount}</b><br>${l.items}
                </div>
            `).join('');
            document.getElementById('historyModal').style.display = 'flex';
        }
    </script>
</body>
</html>
